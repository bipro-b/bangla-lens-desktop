<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --paper: #fbfaf6; --ink: #1d2a22; --muted: #6b766f;
    --green: #006a4e; --red: #c8102e; --line: #e3e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #18201b; --ink: #eef1ea; --muted: #97a39b; --green: #2fa37c; --line: #2c372f; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--ink); padding: 6px; user-select: text; }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    border-left: 4px solid var(--green);
    box-shadow: 0 10px 30px -12px rgba(0, 40, 25, .45);
    overflow: hidden;
  }
  .bn {
    font-family: "Nirmala UI", "Noto Sans Bengali", "Vrinda", sans-serif;
    font-size: 17px; line-height: 1.75; padding: 14px 16px 10px;
    max-height: 380px; overflow-y: auto; white-space: pre-wrap;
  }
  .src {
    color: var(--muted); font-size: 12px; padding: 0 16px 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 16px;
    border-top: 1px solid var(--line); font-size: 11px; color: var(--muted);
  }
  .bar .sp { flex: 1; }
  button {
    font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--green); color: var(--green); }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .loading .bn { color: var(--muted); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }
  .loading .dot { animation: pulse .8s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .loading .dot { animation: none; } }
  .error .bn { font-family: "Segoe UI", sans-serif; font-size: 13px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bn" id="bn"></div>
    <div class="src" id="src"></div>
    <div class="bar">
      <span><span class="dot"></span><span id="status">Alt+B</span></span>
      <span class="sp"></span>
      <button id="copy">Copy Bangla</button>
      <button id="close" title="Esc">Close</button>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let current = '';

  const fit = () => requestAnimationFrame(() => window.lens.resize(document.body.scrollHeight));

  window.lens.onUpdate((p) => {
    $('card').className = 'card ' + p.state;
    $('copy').hidden = p.state !== 'done';
    $('src').textContent = p.text || '';
    if (p.state === 'loading') { $('bn').textContent = 'অনুবাদ হচ্ছে…'; $('status').textContent = 'Translating'; }
    if (p.state === 'done')    { current = p.bn; $('bn').textContent = p.bn; $('status').textContent = 'Translated'; $('copy').textContent = 'Copy Bangla'; }
    if (p.state === 'error')   { $('bn').textContent = p.msg; $('status').textContent = 'Failed'; }
    if (p.state === 'empty')   { $('bn').textContent = 'No text selected. Select some English text, then press Alt+B.'; $('status').textContent = 'Nothing to translate'; }
    fit();
  });

  $('copy').onclick = () => { window.lens.copy(current); $('copy').textContent = 'Copied'; };
  $('close').onclick = () => window.lens.hide();
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.lens.hide(); });
</script>
</body>
</html>
